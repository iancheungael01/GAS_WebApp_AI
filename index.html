<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AEL Maintenance App</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; max-width: 600px; }
    .card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; background: #f9f9f9; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:disabled { background: #aaa; }
    .status { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; display: block; }
    .error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>

  <h2>AEL Maintenance Upload</h2>

  <div class="card">
    <label for="siteName">Site Name</label>
    <input type="text" id="siteName" placeholder="e.g. Site A" />

    <label for="machineName">Machine Name</label>
    <input type="text" id="machineName" placeholder="e.g. Generator 1" />

    <label for="photoInput">Select / Take Photo</label>
    <input type="file" id="photoInput" accept="image/*" />

    <button id="uploadBtn" onclick="handleUpload()">Upload Photo</button>
  </div>

  <div id="statusBox" class="status"></div>

  <script>
    // Replace with your Web App Executable URL from Google Apps Script
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzHhEYmam6LwOHE1NuDZ7LP4dZooUb_xGSfX5ggdtPdagRy3bDkRxcNYHjW6EPRFHkotQ/exec';

    /**
     * Bypasses CORS by avoiding OPTIONS preflight requests
     */
    async function apiRequest(payload) {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8' // Crucial: Avoids OPTIONS preflight check
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error('HTTP Error Status: ' + response.status);
      }

      return await response.json();
    }

    async function handleUpload() {
      const site = document.getElementById('siteName').value.trim();
      const machine = document.getElementById('machineName').value.trim();
      const photoFile = document.getElementById('photoInput').files[0];
      const btn = document.getElementById('uploadBtn');

      if (!photoFile) {
        showStatus('Please select a photo first.', false);
        return;
      }

      btn.disabled = true;
      showStatus('Uploading...', true);

      try {
        const base64Photo = await fileToBase64(photoFile);

        const payload = {
          action: 'uploadPhoto',
          site: site,
          machine: machine,
          photoBase64: base64Photo,
          timestamp: new Date().toISOString()
        };

        const res = await apiRequest(payload);

        if (res.status === 'success') {
          showStatus('Uploaded successfully! Link: ' + res.photoUrl, true);
        } else {
          showStatus('Upload error: ' + res.message, false);
        }
      } catch (err) {
        showStatus('Failed to send data: ' + err.message, false);
      } finally {
        btn.disabled = false;
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function showStatus(message, isSuccess) {
      const box = document.getElementById('statusBox');
      box.textContent = message;
      box.className = 'status ' + (isSuccess ? 'success' : 'error');
    }

    // Register Service Worker for offline capability
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed:', err));
    }
  </script>
</body>
</html>
